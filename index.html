<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f11" />
  <meta name="description" content="Jooyeoun Lee — Architecture Portfolio" />
  <title>Jooyeoun Lee — Portfolio</title>

  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body {
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    body { overflow-x: hidden; }

    .intro {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      padding: 48px;
      overflow: hidden;
      background: #111;
    }

    .hero-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center center;
      opacity: 0;
      transform: scale(1.01);
      transition: opacity .75s ease-in-out;
      will-change: opacity;
    }
    .hero-layer.active { opacity: 1; }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(8,10,16,.18), rgba(8,10,16,.48));
      z-index: 2;
      pointer-events: none;
    }

    .intro-card {
      position: relative;
      z-index: 3;
      max-width: 760px;
    }
    .eyebrow {
      margin: 0 0 12px;
      font-size: 13px;
      letter-spacing: .20em;
      text-transform: uppercase;
      opacity: .9;
    }
    .title {
      margin: 0;
      font-size: clamp(48px, 9vw, 120px);
      line-height: .92;
      letter-spacing: -.04em;
      font-weight: 700;
    }
    .subtitle {
      margin: 18px 0 0;
      font-size: clamp(14px, 2vw, 20px);
      line-height: 1.5;
      max-width: 680px;
      color: rgba(255,255,255,.9);
    }
    .cta-row {
      margin-top: 28px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
    }
    .btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,.85);
      background: rgba(255,255,255,.08);
      color: #fff;
      text-decoration: none;
      padding: 14px 22px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: .14em;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
      transition: .2s ease;
    }
    .btn:hover {
      background: rgba(255,255,255,.18);
      transform: translateY(-1px);
    }
    .scroll-hint {
      font-size: 13px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(255,255,255,.86);
    }

    #portfolio-anchor { position: relative; top: -1px; display: block; }
    #portfolio {
      width: min(100%, 1800px);
      margin: 0 auto;
      padding: 24px;
      color: #000;
    }
    .page {
      width: 100%;
      margin: 0 auto 24px;
      padding: 0;
      line-height: 0;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(0,0,0,.06);
    }
    .page:last-child { margin-bottom: 0; }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
      background: #fff;
    }

    @media (max-width: 768px) {
      .intro { padding: 22px; align-items: flex-end; }
      .subtitle { max-width: 95%; }
      #portfolio { padding: 12px; }
      .page { margin-bottom: 12px; }
      .cta-row { gap: 10px; }
      .btn { padding: 12px 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .hero-layer { transition: none; }
    }
  </style>
</head>
<body>
  <section class="intro" aria-label="Intro cover">
    <div class="hero-layer active" id="heroA"></div>
    <div class="hero-layer" id="heroB"></div>
    <div class="hero-overlay"></div>

    <div class="intro-card">
      <p class="eyebrow">Architecture Portfolio</p>
      <h1 class="title">JOOYEOUN<br />LEE</h1>
      <p class="subtitle">Selected works in architecture, interiors, and academic design.</p>
      <div class="cta-row">
        <a class="btn" href="#portfolio-anchor">View Portfolio</a>
        <a class="btn" href="./JooyeounLee_CV.pdf" target="_blank" rel="noopener">View CV</a>
        <span class="scroll-hint">Scroll ↓</span>
      </div>
    </div>
  </section>

  <span id="portfolio-anchor" aria-hidden="true"></span>
  <main id="portfolio" aria-label="Jooyeoun Lee portfolio"></main>

  <script type="module">
    // ---------- HERO SLIDESHOW ----------
    const heroImages = [
      './heroes/hero-01.webp',
      './heroes/hero-02.webp',
      './heroes/hero-03.webp',
      './heroes/hero-04.webp',
      './heroes/hero-05.webp',
      './heroes/hero-06.webp',
      './heroes/hero-07.webp',
      './heroes/hero-08.webp',
      './heroes/hero-09.webp',
      './heroes/hero-10.webp'
    ];

    function shuffled(items) {
      const a = [...items];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    let heroOrder = shuffled(heroImages);
    let heroIndex = 0;
    let front = document.getElementById('heroA');
    let back = document.getElementById('heroB');

    function setBg(el, url) {
      el.style.backgroundImage = `url("${url}")`;
    }

    // Always show the original hero image first.
    const fixedFirstHero = './intro-hero.jpg';
    setBg(front, fixedFirstHero);
    setBg(back, heroOrder[0]);

    // Preload the fixed first hero and all random hero images quietly.
    [fixedFirstHero, ...heroOrder].forEach(src => { const img = new Image(); img.src = src; });

    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (!reducedMotion) {
      // After 2 seconds, leave the fixed intro hero and begin the randomized slideshow.
      setInterval(() => {
        const next = heroOrder[heroIndex];
        setBg(back, next);
        back.classList.add('active');
        front.classList.remove('active');
        [front, back] = [back, front];

        heroIndex++;
        if (heroIndex >= heroOrder.length) {
          const lastShown = heroOrder[heroOrder.length - 1];
          heroOrder = shuffled(heroImages);
          // avoid immediate repeat between shuffled rounds
          if (heroOrder[0] === lastShown && heroOrder.length > 1) {
            [heroOrder[0], heroOrder[1]] = [heroOrder[1], heroOrder[0]];
          }
          heroIndex = 0;
        }
      }, 2000);
    }

    // ---------- PORTFOLIO PDF ----------
    const PDF_URL = './JooyeounLee_portfolio.pdf';
    const PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
    const WORKER_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
    const portfolio = document.getElementById('portfolio');

    async function start() {
      const pdfjsLib = await import(PDFJS_URL);
      pdfjsLib.GlobalWorkerOptions.workerSrc = WORKER_URL;
      const pdf = await pdfjsLib.getDocument({
        url: PDF_URL,
        rangeChunkSize: 262144,
        disableAutoFetch: false,
        disableStream: false
      }).promise;

      const first = await pdf.getPage(1);
      const base = first.getViewport({ scale: 1 });
      const aspect = `${base.width} / ${base.height}`;
      const slots = [];

      for (let i = 1; i <= pdf.numPages; i++) {
        const wrap = document.createElement('section');
        wrap.className = 'page';
        wrap.style.aspectRatio = aspect;
        wrap.dataset.page = i;
        wrap.setAttribute('aria-label', `Portfolio page ${i}`);
        const canvas = document.createElement('canvas');
        wrap.appendChild(canvas);
        portfolio.appendChild(wrap);
        slots.push(wrap);
      }

      async function renderPage(wrap) {
        if (wrap.dataset.rendered === '1' || wrap.dataset.rendering === '1') return;
        wrap.dataset.rendering = '1';
        const pageNumber = Number(wrap.dataset.page);
        const page = await pdf.getPage(pageNumber);
        const unit = page.getViewport({ scale: 1 });
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
        const availableWidth = Math.max(320, Math.min(portfolio.clientWidth, 1800));
        const targetPixelWidth = Math.max(1400, Math.min(availableWidth * pixelRatio, 2550));
        const viewport = page.getViewport({ scale: targetPixelWidth / unit.width });
        const canvas = wrap.querySelector('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        canvas.width = Math.ceil(viewport.width);
        canvas.height = Math.ceil(viewport.height);
        canvas.style.width = '100%';
        canvas.style.height = 'auto';
        await page.render({ canvasContext: ctx, viewport }).promise;
        wrap.style.aspectRatio = 'auto';
        wrap.dataset.rendered = '1';
        delete wrap.dataset.rendering;
        page.cleanup();
      }

      const observer = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          if (entry.isIntersecting) {
            renderPage(entry.target).catch(() => {});
            observer.unobserve(entry.target);
          }
        }
      }, { rootMargin: '1800px 0px' });

      slots.forEach(slot => observer.observe(slot));
      await renderPage(slots[0]);
      if (slots[1]) renderPage(slots[1]);
    }

    start().catch(() => {
      window.location.replace(PDF_URL);
    });
  </script>
</body>
</html>
